version: 2

project_name: code-review

before:
  hooks:
    - go mod tidy

builds:
  - id: code-review
    main: ./cmd/code-review
    binary: code-review
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/LucasNav6/code-review-cli/internal/buildinfo.Version={{ .Tag }}
      - -X github.com/LucasNav6/code-review-cli/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/LucasNav6/code-review-cli/internal/buildinfo.Date={{ .Date }}

archives:
  - id: code-review
    ids:
      - code-review
    name_template: "code-review_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: LucasNav6
    name: code-review-cli
  prerelease: auto
